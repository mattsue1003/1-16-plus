<!DOCTYPE html>
<html lang="zh-Hant" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>1–16 數字卡加總挑戰</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFFFFF; --dot:rgba(2,128,144,.13); --panel:#F3F8F9; --paper:#FFFFFF;
  --ink:#12343B; --muted:#4F676D; --rule:#D5E4E6;
  --orange:#E8552D; --orange-soft:#FFF0EA; --amber:#F4A93C; --amber-soft:#FFE7BF;
  --teal:#028090; --teal-dark:#016270; --teal-soft:#E0F1F3;
  --rail:#D7E7EA; --slot:#9CC4CA;
  --num:"Baloo 2", "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
  --zh:"Noto Sans TC", "Microsoft JhengHei", "PingFang TC", "Heiti TC", system-ui, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F2428; --dot:rgba(120,200,210,.10); --panel:#16323A; --paper:#1C3B43;
    --ink:#EAF4F5; --muted:#A9C3C8; --rule:#2B4D55; --orange-soft:#3A2620; --amber-soft:#43381F;
    --teal-soft:#123F46; --rail:#2B4D55; --slot:#4C7C84;
  }
}
:root[data-theme="dark"]{
  --bg:#0F2428; --dot:rgba(120,200,210,.10); --panel:#16323A; --paper:#1C3B43;
  --ink:#EAF4F5; --muted:#A9C3C8; --rule:#2B4D55; --orange-soft:#3A2620; --amber-soft:#43381F;
  --teal-soft:#123F46; --rail:#2B4D55; --slot:#4C7C84;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);overflow-x:hidden;height:100%}
body{
  margin:0; min-height:100%; overflow-x:hidden; color:var(--ink); font-family:var(--zh); font-size:18px; line-height:1.6;
  background-color:var(--bg);
  background-image:radial-gradient(var(--dot) 1.6px, transparent 1.7px);
  background-size:26px 26px;
}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible,.card:focus-visible,.slot:focus-visible{outline:3px solid var(--orange);outline-offset:3px}
.wrap{max-width:1180px;margin:0 auto;padding:18px 18px 40px}

/* ---------- header ---------- */
header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin:6px 0 18px}
.brandmark{display:flex;align-items:center;gap:14px}
.logo-cards{display:flex;gap:4px}
.logo-cards span{display:grid;place-items:center;width:40px;height:46px;border:3px solid var(--ink);border-radius:9px;background:var(--paper);
  font:800 24px/1 var(--num);box-shadow:0 4px 0 var(--ink)}
.logo-cards span:nth-child(1){transform:rotate(-8deg);background:var(--amber)}
.logo-cards span:nth-child(2){transform:translateY(-4px)}
.logo-cards span:nth-child(3){transform:rotate(7deg);background:var(--teal);color:#fff}
h1{margin:0;font-weight:900;font-size:clamp(26px,4.4vw,40px);letter-spacing:.02em;line-height:1.2}
.sub{margin:4px 0 0;color:var(--muted);font-size:clamp(16px,2.2vw,19px)}
.solved-count{font-weight:700;color:var(--muted);font-size:17px}
.solved-count b{font:800 26px/1 var(--num);color:var(--orange)}

/* ---------- setup ---------- */
.setup{background:var(--paper);border:3px solid var(--ink);border-radius:22px;padding:18px;box-shadow:0 6px 0 var(--ink);margin-bottom:26px}
.setup h2{font-size:19px;margin:0 0 10px;font-weight:900}
.modes{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:18px}
.mode{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 8px 10px;border:2.5px solid var(--rule);border-radius:16px;background:var(--paper);text-align:center;min-width:0;transition:transform .12s}
.mode:hover{transform:translateY(-2px)}
.mode svg{width:64px;height:54px}
.mode .mname{font-weight:900;font-size:18px;line-height:1.25}
.mode .minfo{font-size:14.5px;color:var(--muted);line-height:1.3}
.mode[aria-pressed="true"]{border-color:var(--orange);background:var(--orange-soft);box-shadow:0 4px 0 var(--orange)}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px 20px}
.opt label.ol{display:block;font-weight:900;font-size:17px;margin-bottom:6px}
.seg{display:flex;border:2.5px solid var(--ink);border-radius:14px;overflow:hidden;background:var(--paper)}
.seg button{flex:1;border:0;background:transparent;padding:9px 4px;font-weight:700;font-size:17px;min-width:0;white-space:nowrap}
.seg button+button{border-left:2px solid var(--ink)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.seg button:disabled{opacity:.35;cursor:not-allowed}
.optnote{font-size:15px;color:var(--muted);margin-top:5px;line-height:1.45;min-height:1.45em}
.stepper{display:flex;align-items:center;gap:8px;margin-top:8px}
.stepper button{width:46px;height:46px;border-radius:12px;border:2.5px solid var(--ink);background:var(--paper);font:800 26px/1 var(--num)}
.stepper output{min-width:64px;text-align:center;font:800 34px/1 var(--num);color:var(--orange)}
.stepper.off{opacity:.35;pointer-events:none}
.toggles{display:flex;flex-direction:column;gap:8px}
.tg{display:flex;align-items:center;gap:10px;border:0;background:none;padding:0;font-weight:700;font-size:17px;text-align:left}
.tg .sw{flex:none;width:52px;height:30px;border-radius:30px;background:var(--rule);position:relative;transition:background .15s}
.tg .sw::after{content:"";position:absolute;top:4px;left:4px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .15s}
.tg[aria-checked="true"] .sw{background:var(--teal)}
.tg[aria-checked="true"] .sw::after{left:26px}

/* ---------- play ---------- */
.play{background:var(--paper);border:3px solid var(--ink);border-radius:26px;box-shadow:0 6px 0 var(--ink);padding:18px 16px 20px;position:relative}
.task{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:6px 14px;text-align:center;margin:0 0 6px}
.task .rule{font-weight:900;font-size:clamp(20px,3vw,30px);line-height:1.35}
.target{display:inline-grid;place-items:center;min-width:1.7em;padding:0 .25em;height:1.5em;border-radius:.35em;background:var(--orange);color:#fff;
  font:800 clamp(38px,6vw,64px)/1 var(--num);box-shadow:0 5px 0 #A93716;transform:rotate(-3deg)}
.status{text-align:center;font-weight:700;font-size:clamp(17px,2.2vw,21px);color:var(--muted);min-height:1.6em;margin:4px 0 2px}
.status.good{color:var(--teal)}
.status.warn{color:var(--orange)}
.board-wrap{position:relative;display:flex;justify-content:center;align-items:center;margin:4px 0 10px}
.board{position:relative}
.board svg.rails{position:absolute;inset:0;overflow:visible;pointer-events:none}
.rails line{stroke:var(--rail);stroke-linecap:round;transition:stroke .25s}
.rails line.ok{stroke:var(--teal);opacity:.55}
.rails line.bad{stroke:var(--orange);opacity:.45}

.slot{position:absolute;border-radius:18%;border:3px dashed var(--slot);background:rgba(2,128,144,.05);display:grid;place-items:center;transform:translate(-50%,-50%)}
.slot.empty::after{content:"";width:22%;height:22%;border-radius:50%;background:var(--slot);opacity:.45}
.slot.target-hover{border-color:var(--orange);background:var(--orange-soft);border-style:solid}
.slot.wanted{animation:wanted 1s ease-in-out infinite}
@keyframes wanted{50%{border-color:var(--orange);background:var(--orange-soft)}}
.slot>.card{position:absolute;inset:-3px;width:auto;height:auto}

.card{display:grid;place-items:center;border:3px solid var(--ink);border-radius:18%;background:var(--paper);color:var(--ink);
  font-family:var(--num);font-weight:800;line-height:1;box-shadow:0 5px 0 var(--ink);user-select:none;-webkit-user-select:none;touch-action:none;
  transition:transform .12s, background .12s, box-shadow .12s;position:relative}
.card span{transform:translateY(.06em)}
.card.fixed{background:var(--teal);border-color:var(--teal-dark);color:#fff;box-shadow:0 5px 0 var(--teal-dark);cursor:default}
.card.fixed::before{content:"";position:absolute;top:8%;right:8%;width:13%;height:13%;border-radius:50%;background:#fff;opacity:.8}
.card.reveal{background:var(--amber-soft);border-color:#B87410;box-shadow:0 5px 0 #B87410}
.card.sel{background:var(--amber);transform:translateY(-8px);box-shadow:0 11px 0 var(--ink)}
.card.pop{animation:pop .28s ease-out}
@keyframes pop{0%{transform:scale(.6)}70%{transform:scale(1.08)}100%{transform:scale(1)}}
.card.dragging{opacity:.25}
.ghost{position:fixed;z-index:50;pointer-events:none;transform:translate(-50%,-50%) rotate(-4deg) scale(1.08);box-shadow:0 14px 22px rgba(18,52,59,.28)}

.bubble{position:absolute;transform:translate(-50%,-50%);min-width:2.1em;height:2.1em;padding:0 .35em;border-radius:1.05em;display:grid;place-items:center;
  border:2.5px solid var(--rule);background:var(--paper);color:var(--muted);font:800 1em/1 var(--num);transition:background .2s,color .2s,border-color .2s}
.bubble.part{border-color:var(--ink);color:var(--ink)}
.bubble.ok{background:var(--teal);border-color:var(--teal);color:#fff}
.bubble.bad{background:var(--orange);border-color:var(--orange);color:#fff}
.bubble.hidden{visibility:hidden}
.bubble.flash{animation:flash .5s ease-out}
.bubble.shake{animation:shake .45s ease-in-out}
@keyframes flash{0%{transform:translate(-50%,-50%) scale(1.45)}100%{transform:translate(-50%,-50%) scale(1)}}
@keyframes shake{20%,60%{transform:translate(-62%,-50%)}40%,80%{transform:translate(-38%,-50%)}}
.center-target{position:absolute;transform:translate(-50%,-50%);display:grid;place-items:center;text-align:center;color:var(--orange);
  font:800 1em/1 var(--num);opacity:.9}
.center-target small{display:block;font:900 .3em/1.2 var(--zh);color:var(--muted);margin-bottom:.12em}
.plus{position:absolute;transform:translate(-50%,-50%);font:800 1em/1 var(--num);color:var(--muted)}

.hand-label{text-align:center;font-weight:900;font-size:17px;color:var(--muted);margin:6px 0 8px}
.hand{display:flex;flex-wrap:wrap;justify-content:center;gap:12px 12px;padding:12px;border-radius:20px;background:var(--panel);min-height:96px;border:2.5px solid transparent;transition:border-color .15s,background .15s}
.hand.target-hover{border-color:var(--orange);background:var(--orange-soft)}
.hand .card{width:var(--hc,74px);height:var(--hc,74px);font-size:calc(var(--hc,74px)*.52);cursor:grab}
.hand-empty{align-self:center;color:var(--muted);font-weight:700;font-size:16px}

.actions{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:16px}
.btn{border:3px solid var(--ink);border-radius:14px;background:var(--paper);padding:10px 18px;font-weight:900;font-size:18px;box-shadow:0 4px 0 var(--ink);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn.primary{background:var(--orange);color:#fff;border-color:#A93716;box-shadow:0 4px 0 #A93716}
.btn.teal{background:var(--teal);color:#fff;border-color:var(--teal-dark);box-shadow:0 4px 0 var(--teal-dark)}
.btn:disabled{opacity:.4;cursor:not-allowed}

.win{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(.8);opacity:0;pointer-events:none;z-index:20;
  background:var(--paper);border:3px solid var(--ink);border-radius:24px;box-shadow:0 8px 0 var(--ink),0 20px 50px rgba(18,52,59,.25);padding:22px 28px;text-align:center;
  transition:opacity .25s,transform .25s;width:min(92%,440px)}
.win.show{opacity:1;transform:translate(-50%,-50%) scale(1);pointer-events:auto}
.win h3{margin:0 0 4px;font-size:clamp(28px,5vw,42px);font-weight:900;color:var(--teal)}
.win p{margin:0 0 16px;font-size:19px;font-weight:700}
.win .actions{margin-top:0}

details.tips{margin-top:22px;background:var(--paper);border:2.5px solid var(--rule);border-radius:18px;padding:12px 18px}
details.tips summary{font-weight:900;font-size:18px;cursor:pointer}
details.tips p{margin:10px 0 0;font-size:17px}
footer{text-align:center;color:var(--muted);font-size:15px;margin-top:28px}
canvas#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:60}

.stage-bar{display:none}
/* ---------- projection mode ---------- */
body.stage{background-size:34px 34px}
body.stage .wrap{max-width:none;padding:10px 14px;height:100%}
body.stage header.top, body.stage .setup, body.stage details.tips, body.stage footer{display:none}
body.stage .play{height:calc(100vh - 20px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;border-radius:20px;padding:10px 14px 12px}
body.stage .board-wrap{flex:1;min-height:0;margin:0}
body.stage .hand{min-height:0}
body.stage .hand-label{display:none}
body.stage .actions{margin-top:10px}
body.stage .task .rule{font-size:clamp(24px,3.4vw,40px)}
body.stage .target{font-size:clamp(46px,7vw,84px)}


@media (max-width:560px){
  .wrap{padding:12px 10px 32px}
  .setup{padding:14px 12px}
  .modes{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
  .mode{padding:8px 4px}
  .mode .mname{font-size:16px}
  .mode .minfo{display:none}
  .logo-cards{display:none}
  .seg button{font-size:16px}
  .play{padding:14px 8px 16px}
  .btn{padding:9px 13px;font-size:17px}
  .hand{gap:9px;padding:10px 6px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brandmark">
      <div class="logo-cards" aria-hidden="true"><span>1</span><span>8</span><span>16</span></div>
      <div>
        <h1>1–16 數字卡加總挑戰</h1>
        <p class="sub">把數字卡排進格子裡，讓每一條線加起來都一樣</p>
      </div>
    </div>
    <div class="solved-count">已完成 <b id="solved">0</b> 題</div>
  </header>

  <section class="setup" aria-label="出題設定">
    <h2>選一個玩法</h2>
    <div class="modes" id="modes"></div>
    <div class="opts">
      <div class="opt">
        <label class="ol">難度</label>
        <div class="seg" id="diffSeg">
          <button data-v="easy">簡單</button><button data-v="mid">中等</button><button data-v="hard">困難</button>
        </div>
        <div class="optnote" id="diffNote"></div>
      </div>
      <div class="opt" id="optHand">
        <label class="ol">手上的牌</label>
        <div class="seg" id="handSeg">
          <button data-v="exact">剛好夠用</button><button data-v="extra">多幾張</button><button data-v="all">剩下全部</button>
        </div>
        <div class="optnote" id="handNote"></div>
      </div>
      <div class="opt" id="optTgt">
        <label class="ol">目標數字</label>
        <div class="seg" id="tgtSeg">
          <button data-v="random">隨機出題</button><button data-v="set">自己指定</button>
        </div>
        <div class="stepper off" id="stepper">
          <button id="tMinus" aria-label="目標數字減少">−</button>
          <output id="tVal">25</output>
          <button id="tPlus" aria-label="目標數字增加">+</button>
        </div>
        <div class="optnote" id="tgtNote"></div>
      </div>
      <div class="opt toggles">
        <label class="ol">輔助</label>
        <button class="tg" id="tgSums" role="switch" aria-checked="true"><span class="sw"></span>顯示每條線目前的總和</button>
        <button class="tg" id="tgSound" role="switch" aria-checked="true"><span class="sw"></span>音效</button>
      </div>
    </div>
  </section>

  <section class="play" id="play" aria-label="遊戲區">
    <div class="task"><span class="rule" id="ruleText"></span><span class="target" id="targetBadge">25</span></div>
    <div class="status" id="status" aria-live="polite"></div>
    <div class="board-wrap" id="boardWrap"><div class="board" id="board"></div></div>
    <div class="hand-label" id="handLabel">手上的數字卡（點一張，再點格子；也可以直接拖曳）</div>
    <div class="hand" id="hand"></div>
    <div class="actions">
      <button class="btn primary" id="bNext">下一題</button>
      <button class="btn" id="bClear">全部收回</button>
      <button class="btn" id="bHint">給我一張提示</button>
      <button class="btn" id="bReveal">看答案</button>
      <button class="btn teal" id="bStage">投影模式</button>
    </div>
    <div class="win" id="win" role="dialog" aria-modal="false" aria-labelledby="winTitle">
      <h3 id="winTitle">完成了！</h3>
      <p id="winText"></p>
      <div class="actions">
        <button class="btn primary" id="wNext">下一題</button>
        <button class="btn" id="wStay">再看看</button>
      </div>
    </div>
  </section>

  <details class="tips">
    <summary>帶領小撇步</summary>
    <p id="tipText"></p>
    <p>手牌選「剩下全部」時，答案不只一種；只要每條線都對，系統就算完成。按「看答案」顯示的是其中一種排法，可以請大家比比看自己的排法哪裡不一樣。</p>
    <p>投影時按「投影模式」，畫面只留題目、格子和手牌，字會放到最大；再按一次「離開投影」回到設定。</p>
  </details>
  <footer>愛迪樂健康促進團隊</footer>
</div>
<canvas id="fx"></canvas>

<script>
(() => {
"use strict";
/* ============ shape definitions (single source) ============ */
const R3 = Math.sqrt(3) / 2;
const range = (a, b) => { const r = []; for (let i = a; i < b; i++) r.push(i); return r; };

function borderShape(n){
  const s = [];
  for (let i = 0; i < n; i++) s.push([i, 0]);
  for (let i = 1; i < n; i++) s.push([n - 1, i]);
  for (let i = n - 2; i >= 0; i--) s.push([i, n - 1]);
  for (let i = n - 2; i >= 1; i--) s.push([0, i]);
  const m = (n - 1) / 2, o = 1.0;
  return {
    slots: s.map(([x, y]) => ({x, y})),
    lines: [
      {cells: range(0, n), bx: m, by: -o, name: "上邊"},
      {cells: range(n - 1, 2 * n - 1), bx: n - 1 + o, by: m, name: "右邊"},
      {cells: range(2 * n - 2, 3 * n - 2), bx: m, by: n - 1 + o, name: "下邊"},
      {cells: [...range(3 * n - 3, 4 * n - 4), 0], bx: -o, by: m, name: "左邊"}
    ],
    center: {x: m, y: m}
  };
}
function crossShape(arm){
  const c = arm, slots = [{x: c, y: c}], v = [], h = [];
  for (let i = 0; i <= 2 * arm; i++) { if (i === c) continue; slots.push({x: c, y: i}); }
  for (let i = 0; i <= 2 * arm; i++) { if (i === c) continue; slots.push({x: i, y: c}); }
  slots.forEach((p, idx) => { if (p.x === c) v.push(idx); if (p.y === c) h.push(idx); });
  v.sort((a, b) => slots[a].y - slots[b].y); h.sort((a, b) => slots[a].x - slots[b].x);
  return { slots, lines: [
    {cells: v, bx: c, by: 2 * arm + 1.0, name: "直的"},
    {cells: h, bx: 2 * arm + 1.0, by: c, name: "橫的"}
  ]};
}
function miShape(){
  const pos = [[1,1],[0,0],[1,0],[2,0],[2,1],[2,2],[1,2],[0,2],[0,1]];
  const slots = pos.map(([x, y]) => ({x, y}));
  const at = (x, y) => slots.findIndex(p => p.x === x && p.y === y);
  return { slots, lines: [
    {cells: [at(0,1), at(1,1), at(2,1)], bx: 3.0, by: 1, name: "橫線"},
    {cells: [at(1,0), at(1,1), at(1,2)], bx: 1, by: 3.0, name: "直線"},
    {cells: [at(0,0), at(1,1), at(2,2)], bx: 2.9, by: 2.9, name: "斜線"},
    {cells: [at(2,0), at(1,1), at(0,2)], bx: -0.9, by: 2.9, name: "斜線"}
  ]};
}
function triShape(n){
  const g = 1.14, L = (n - 1) * g;
  const A = {x: L / 2, y: 0}, B = {x: 0, y: L * R3}, C = {x: L, y: L * R3};
  const lerp = (p, q, t) => ({x: p.x + (q.x - p.x) * t, y: p.y + (q.y - p.y) * t});
  const slots = [];
  const side = (P, Q) => { const idx = []; for (let k = 0; k < n - 1; k++) { slots.push(lerp(P, Q, k / (n - 1))); idx.push(slots.length - 1); } return idx; };

  const j = P.board.indexOf(v);
  if (j >= 0) { P.board[j] = 0; P.hand.push(v); }
  if (P.board[i]) P.hand.push(P.board[i]);
  P.board[i] = v; P.hand = P.hand.filter(x => x !== v); sortHand();
  P.fixed.add(i); lastPlaced = i; sel = null;
  setStatus("幫你放好一張了（藍綠色那張）", "");
  sfx("place"); renderBoard(); renderHand(); updateSums(true);
  if (isComplete()) checkDone();
}
function reveal(){
  if (P.done || P.locked) return;
  const pool = new Set(P.hand.concat(P.board.filter(v => v)));
  P.board.forEach((v, i) => { if (!P.fixed.has(i) && P.sol[i]) P.revealed.add(i); });
  P.board = P.sol.slice();
  P.hand = [...pool].filter(v => !P.board.includes(v)); sortHand();
  sel = null; renderBoard(); renderHand(); updateSums(false);
  P.done = true;
  if (P.kind === "place") setStatus(P.revealMsg, "good");
  else setStatus(st.hand === "all" || st.mode === "sum" ? "這是其中一種排法，答案不只一種" : "這是其中一種排法", "good");
}
function clearBoard(){
  if (!P || P.kind === "alt" || P.locked) return;
  P.board.forEach((v, i) => { if (v && !P.fixed.has(i)) { P.hand.push(v); P.board[i] = 0; } });
  P.revealed.clear(); P.done = false; hideWin();
  sortHand(); sel = null; sfx("back");
  renderBoard(); renderHand(); updateSums(false); setStatus("卡片都收回來了", "");
}

/* ============ pointer: tap & drag (engine) ============ */
let drag = null;
function onDown(e){
  if (!P || P.kind === "alt") return;
  const card = e.target.closest(".card");
  const slotBox = e.target.closest("[data-slot-box]");
  if (!card && slotBox) { tapSlot(+slotBox.dataset.slotBox); return; }
  if (!card || P.done || P.locked) return;
  const src = card.dataset.hand ? {from: "hand", v: +card.dataset.hand} : {from: "slot", i: +card.dataset.slot};
  if (src.from === "slot" && P.fixed.has(src.i)) return;
  drag = {src, card, x: e.clientX, y: e.clientY, moved: false, ghost: null, over: null};
  e.preventDefault();
}
function onMove(e){
  if (!drag) return;
  if (!drag.moved && Math.hypot(e.clientX - drag.x, e.clientY - drag.y) < 8) return;
  if (!drag.moved) {
    drag.moved = true;
    const r = drag.card.getBoundingClientRect();
    const g = drag.card.cloneNode(true);
    g.classList.remove("sel", "pop"); g.classList.add("ghost");
    g.style.width = r.width + "px"; g.style.height = r.height + "px"; g.style.fontSize = getComputedStyle(drag.card).fontSize;
    document.body.appendChild(g); drag.ghost = g; drag.card.classList.add("dragging");
  }
  drag.ghost.style.left = e.clientX + "px"; drag.ghost.style.top = e.clientY + "px";
  const el = document.elementFromPoint(e.clientX, e.clientY);
  const over = el && (el.closest("[data-slot-box]") || el.closest("#hand"));
  if (drag.over && drag.over !== over) drag.over.classList.remove("target-hover");
  if (over && !(over.dataset.slotBox && P.fixed.has(+over.dataset.slotBox))) { over.classList.add("target-hover"); drag.over = over; } else drag.over = null;
}
function onUp(){
  if (!drag) return;
  const d = drag; drag = null;
  if (d.over) d.over.classList.remove("target-hover");
  if (d.ghost) d.ghost.remove();
  d.card.classList.remove("dragging");
  if (!d.moved) { tapCard(d.src); return; }
  const o = d.over;
  if (!o) return;
  if (o.id === "hand") { if (d.src.from === "slot") returnSlot(d.src.i); return; }
  const j = +o.dataset.slotBox;
  if (d.src.from === "hand") placeFromHand(d.src.v, j); else moveSlot(d.src.i, j);
}
function tapCard(src){
  ensureAudio();
  if (src.from === "hand") {
    sel = sel && sel.from === "hand" && sel.v === src.v ? null : src;
    renderHand(); renderBoard(); updateSums(false);
    if (sel) { setStatus(`拿起 ${src.v}，點一個格子放下去`, ""); markWanted(true); }
    else markWanted(false);
  } else {
    if (sel && sel.from === "hand") { placeFromHand(sel.v, src.i); return; }
    returnSlot(src.i);
  }
}
function tapSlot(i){
  ensureAudio();
  if (P.done || P.locked || P.fixed.has(i)) return;
  if (sel && sel.from === "hand") placeFromHand(sel.v, i);
  else setStatus("先點一張手上的數字卡", "");
}
function markWanted(on){ document.querySelectorAll(".slot.empty").forEach(s => s.classList.toggle("wanted", on)); }
document.addEventListener("pointerdown", e => { if (e.target.closest("#board,#hand")) onDown(e); });
window.addEventListener("pointermove", onMove);
window.addEventListener("pointerup", onUp);
window.addEventListener("pointercancel", onUp);
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && isStage()) toggleStage();
  if ((e.key === "Enter" || e.key === " ") && e.target.matches && e.target.matches("div.card,[data-slot-box]")) {
    e.preventDefault();
    const c = e.target;
    if (c.dataset.hand) tapCard({from: "hand", v: +c.dataset.hand});
    else if (c.dataset.slotBox) tapSlot(+c.dataset.slotBox);
  }
});

/* ============ sound ============ */
let AC = null;
function ensureAudio(){ if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } if (AC && AC.state === "suspended") AC.resume(); }
function tone(f, t0, dur, type, vol){
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f, AC.currentTime + t0);
  g.gain.setValueAtTime(0.0001, AC.currentTime + t0);
  g.gain.exponentialRampToValueAtTime(vol, AC.currentTime + t0 + .015);
  g.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime + t0 + dur);
  o.connect(g).connect(AC.destination); o.start(AC.currentTime + t0); o.stop(AC.currentTime + t0 + dur + .05);
}
function sfx(kind){
  if (!st.sound) return; ensureAudio(); if (!AC) return;
  if (kind === "place") { tone(520, 0, .09, "triangle", .25); tone(780, .05, .1, "triangle", .18); }
  if (kind === "back") tone(380, 0, .1, "triangle", .18);
  if (kind === "line") { tone(880, 0, .14, "sine", .2); tone(1175, .09, .2, "sine", .18); }
  if (kind === "bad") { tone(240, 0, .16, "square", .06); tone(200, .14, .2, "square", .05); }
  if (kind === "win") [523, 659, 784, 1047, 1319].forEach((f, k) => tone(f, k * .1, .35, "triangle", .22));
}

/* ============ confetti ============ */
function confetti(){
  if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const cv = $("fx"), ctx = cv.getContext("2d");
  const W = cv.width = innerWidth * devicePixelRatio, H = cv.height = innerHeight * devicePixelRatio;
  const cols = ["#E8552D", "#F4A93C", "#028090", "#12343B", "#7CC6CF"];
  const ps = range(0, 140).map(() => ({x: W / 2 + (Math.random() - .5) * W * .3, y: H * .45, vx: (Math.random() - .5) * 26 * devicePixelRatio, vy: (-Math.random() * 22 - 8) * devicePixelRatio,
    s: (6 + Math.random() * 9) * devicePixelRatio, r: Math.random() * 6, vr: (Math.random() - .5) * .4, c: cols[Math.random() * cols.length | 0], num: Math.random() < .25 ? String(1 + (Math.random() * 16 | 0)) : null}));
  let f = 0;
  const step = () => {
    ctx.clearRect(0, 0, W, H);
    ps.forEach(p => {
      p.vy += .55 * devicePixelRatio; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += p.vr;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c;
      if (p.num) { ctx.font = `800 ${p.s * 2.2}px "Baloo 2", sans-serif`; ctx.textAlign = "center"; ctx.fillText(p.num, 0, 0); }
      else ctx.fillRect(-p.s / 2, -p.s / 3, p.s, p.s * .66);
      ctx.restore();
    });
    if (++f < 150) requestAnimationFrame(step); else ctx.clearRect(0, 0, W, H);
  };
  step();
}

/* ============ setup UI ============ */
function miniIcon(def){
  if (def.icon) return def.icon();
  const sh = def.id === "sum" ? sumShape(3) : def.build();
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  sh.slots.forEach(p => { x0 = Math.min(x0, p.x); y0 = Math.min(y0, p.y); x1 = Math.max(x1, p.x); y1 = Math.max(y1, p.y); });
  const w = x1 - x0 + 1, h = y1 - y0 + 1, k = Math.min(60 / w, 50 / h), ox = (64 - (w - 1) * k) / 2, oy = (54 - (h - 1) * k) / 2;
  const X = x => ox + (x - x0) * k, Y = y => oy + (y - y0) * k, c = k * .78;
  let s = `<svg viewBox="0 0 64 54" aria-hidden="true">`;
  sh.lines.forEach(l => { if (l.eq) return; const a = sh.slots[l.cells[0]], z = sh.slots[l.cells[l.cells.length - 1]]; s += `<line x1="${X(a.x)}" y1="${Y(a.y)}" x2="${X(z.x)}" y2="${Y(z.y)}" stroke="#F4A93C" stroke-width="${k * .22}" stroke-linecap="round"/>`; });
  sh.slots.forEach(p => s += `<rect x="${X(p.x) - c / 2}" y="${Y(p.y) - c / 2}" width="${c}" height="${c}" rx="${c * .22}" fill="#fff" stroke="#12343B" stroke-width="1.8"/>`);
  (sh.plus || []).forEach(p => s += `<text x="${X(p.x)}" y="${Y(p.y) + 4}" font-size="12" font-weight="800" text-anchor="middle" fill="#12343B">+</text>`);
  return s + `</svg>`;
}
function buildModes(){
  const tile = s => `<button class="mode" data-m="${s.id}" aria-pressed="${s.id === st.mode}">${miniIcon(s)}<span class="mname">${s.name}</span><span class="minfo">${s.info}</span></button>`;
  $("modes").innerHTML = SHAPES.map(tile).join("");
  [$("modes")].forEach(g => g.addEventListener("click", e => {
    const b = e.target.closest(".mode"); if (!b) return;
    st.mode = b.dataset.m; save(); syncSetup(); newPuzzle();
    if (window.innerWidth < 900) $("play").scrollIntoView({behavior: "smooth", block: "start"});
  }));
}
function segBind(id, key){
  $(id).addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b || b.disabled) return;
    st[key] = b.dataset.v; save(); syncSetup(); newPuzzle();
  });
}
function syncSetup(){
  document.querySelectorAll(".mode").forEach(b => b.setAttribute("aria-pressed", b.dataset.m === st.mode));
  const segs = {diffSeg: "diff", handSeg: "hand", tgtSeg: "tgt"};
  for (const id in segs) document.querySelectorAll(`#${id} button`).forEach(b => b.setAttribute("aria-pressed", b.dataset.v === st[segs[id]]));
  const d = modeDef(), line = d.kind === "line";
  $("optHand").style.display = line ? "" : "none";
  $("optTgt").style.display = line ? "" : "none";
  $("tgSums").style.display = line ? "" : "none";
  $("solved").textContent = st.solved;
  $("tgSums").setAttribute("aria-checked", st.sums);
  $("tgSound").setAttribute("aria-checked", st.sound);
  if (!line) { $("diffNote").textContent = d.diff[st.diff]; return; }
  const m4 = st.mode === "magic4", isSum = st.mode === "sum";
  document.querySelectorAll("#handSeg button").forEach(b => b.disabled = m4);
  document.querySelectorAll("#tgtSeg button").forEach(b => b.disabled = m4);
  const shape = currentShape(), n = shape.slots.length, hc = hintCount(n);
  $("diffNote").textContent = isSum ? `要挑 ${SUM_K[st.diff]} 張卡` : (hc ? `先幫忙放好 ${hc} 張提示卡（共 ${n} 格）` : `${n} 格全部自己放`);
  $("handNote").textContent = m4 ? "這個玩法一定用到 1 到 16 每一張" :
    isSum ? {exact: "手上多 3 張用不到的牌", extra: "手上多 5 張用不到的牌", all: "1 到 16 全部放在手上，要自己挑，答案不只一種"}[st.hand] :
    {exact: "給的牌剛好都用得到", extra: "多 3 張用不到的牌，要自己挑", all: "提示卡以外的數字全部放在手上，要自己挑，答案不只一種"}[st.hand];
  const feas = feasibleTargets(feasKey(), shape);
  if (m4) st.tgt = "random";
  st.setT = nearestFeasible(st.setT, feas);
  $("tVal").textContent = st.setT;
  $("stepper").classList.toggle("off", st.tgt !== "set" || m4);
  $("tgtNote").textContent = m4 ? "1 到 16 的方陣，每條線一定是 34" :
    `這個玩法可以出 ${feas[0]} 到 ${feas[feas.length - 1]}` + (feas.length < feas[feas.length - 1] - feas[0] + 1 ? "（只有部分數字可以）" : "");
}
function stepTarget(dir){
  const feas = feasibleTargets(feasKey(), currentShape());
  const i = feas.indexOf(st.setT);
  const j = Math.max(0, Math.min(feas.length - 1, (i < 0 ? 0 : i) + dir));
  st.setT = feas[j]; save(); $("tVal").textContent = st.setT; newPuzzle();
}
function rerender(){ if (!P) return; if (P.kind === "alt") { if (G) G.render(); } else { renderBoard(); renderHand(); updateSums(false); } }
function toggleStage(){
  const on = !isStage();
  document.body.classList.toggle("stage", on);
  $("bStage").textContent = on ? "離開投影" : "投影模式";
  try {
    if (on && document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(() => {});
    if (!on && document.fullscreenElement) document.exitFullscreen().catch(() => {});
  } catch (e) {}
  requestAnimationFrame(rerender);
}

/* ============ init ============ */
buildModes();
segBind("diffSeg", "diff"); segBind("handSeg", "hand"); segBind("tgtSeg", "tgt");
$("tMinus").onclick = () => stepTarget(-1);
$("tPlus").onclick = () => stepTarget(1);
$("tgSums").onclick = () => { st.sums = !st.sums; save(); syncSetup(); updateSums(false); };
$("tgSound").onclick = () => { st.sound = !st.sound; save(); syncSetup(); };
$("bNext").onclick = () => { ensureAudio(); newPuzzle(); };
$("wNext").onclick = () => { ensureAudio(); newPuzzle(); };
$("wStay").onclick = hideWin;
$("bClear").onclick = clearBoard;
$("bHint").onclick = () => { ensureAudio(); if (P.done) return; giveHint(); };
$("bReveal").onclick = () => { if (P.done) return; reveal(); };
$("bStage").onclick = toggleStage;
document.addEventListener("fullscreenchange", () => setTimeout(rerender, 120));
let rT; window.addEventListener("resize", () => { clearTimeout(rT); rT = setTimeout(rerender, 120); });
window.addEventListener("orientationchange", () => setTimeout(rerender, 300));
syncSetup();
newPuzzle();
})();
</script>
</body>
